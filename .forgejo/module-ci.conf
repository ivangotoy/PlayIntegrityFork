UPSTREAM_URL=https://github.com/osm0sis/PlayIntegrityFork.git
UPSTREAM_BRANCH=main
ZIP_PREFIX=PlayIntegrityFork
VERSION_CODE_FLOOR=190007
VERSION_CODE_OFFSET=6
CHANGELOG_PATH=CHANGELOG.md
# upstream .github/workflows/android.yml: JDK 21, assembleRelease (copies classes.dex and
# zygisk libs into module/), CI label on versionCodes ending in 1, artifact = module/*
build() {
    git submodule update -q --init --recursive >&2
    export JAVA_HOME="$JAVA_HOME_21"
    chmod +x gradlew
    ./gradlew --no-daemon --warning-mode all assembleRelease >&2
    VERCODE=$(perl -n -e 'print $1 if /^versionCode=(.*)/' module/module.prop)
    if [ "$(echo "$VERCODE" | grep -o '.$')" -eq 1 ]; then
        perl -pi -e "s/^version=(.*)/version=\$1($VERCODE)-CI/" module/module.prop
    fi
    (cd module && zip -qr9 "$OUT/module.zip" .)
}
